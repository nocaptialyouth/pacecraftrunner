name: Marathon-Online Daily Race Import
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-marathon-online.yml'
  schedule:
    - cron: '0 0 * * *' # 09:00 KST; GitHub can start later
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-marathon-online-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backup-source robots and response (diagnostic only)
        run: |
          node - <<'NODE'
          async function check(url) {
            try {
              const r=await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(8000)});
              console.log('[source-check]',new URL(url).hostname,new URL(url).pathname,'status='+r.status,'redirect='+String(r.headers.get('location')||'').slice(0,150));
            }catch(e){console.log('[source-check]',url,'error='+e.message);}
          }
          Promise.all([
            (async()=>{const r=await fetch('https://playatlas.to/robots.txt',{signal:AbortSignal.timeout(8000)});console.log('[playatlas-robots]',(await r.text()).slice(0,2500).replaceAll('\\n',' '));})(),
            (async()=>{const r=await fetch('https://playatlas.to/ko/events/marathon/upcoming',{signal:AbortSignal.timeout(10000)});const h=await r.text();console.log('[playatlas-html]',h.slice(0,1100).replaceAll('\\n',' '),'len='+h.length,'nextData='+h.includes('__NEXT_DATA__'),'jsonld='+h.includes('application/ld+json'));})()
          ]).catch(e=>console.log('[backup-diag-error]',e.message));
          NODE
      - name: Probe original site with safe robots check
        run: node scripts/sync-marathon-online.js
      - name: Update repository dataset
        run: |
          if git diff --quiet -- data/marathon-online-races.json; then
            echo "No race schedule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/marathon-online-races.json
          git commit -m "data: import marathon-online races"
          git push origin HEAD:main
